name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # contents: write to push the version bump commit back to the release branch.
    # id-token: write for npm trusted publishing (OIDC).
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: git config --global user.name "GitHub CD bot"

      - run: git config --global user.email "james.hrisho@gmail.com"

      - run: npm version ${{ github.event.release.tag_name }} --no-git-tag-version

      - run: git add . && git commit -m "[Release] ${{ github.event.release.tag_name }}"

      - run: npm publish

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: react-ace.min.js
          path: dist/react-ace.min.js

      - run: git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
